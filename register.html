<!doctype html><html ng-app="jobApp"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — JobHub</title><link rel="stylesheet" href="css/style.css"><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script></head><body ng-controller="AuthCtrl"><nav class="nav"><a class="brand" href="index.html">▰ jobhub<span class="dot">.</span></a><a href="login.html">Log in ↗</a></nav><main class="auth-layout"><aside class="auth-aside"><div class="eyebrow">MAKE YOUR NEXT MOVE</div><h1>Find work<br>that <em>fits you.</em></h1><p>One profile. Better opportunities. A clearer path forward.</p></aside><section class="auth-card"><div class="eyebrow">GET STARTED</div><h2>Create your account</h2><p class="muted">It only takes a minute.</p><form ng-submit="register()"><label>Full name</label><input ng-model="reg.name" placeholder="Your full name" required><label>Email address</label><input ng-model="reg.email" type="email" placeholder="you@example.com" required><label>Password (8+ characters)</label><input ng-model="reg.password" type="password" minlength="8" required><label>I want to</label><select ng-model="reg.role"><option value="seeker">Find a job</option><option value="recruiter">Hire talent</option></select><button class="btn primary full" ng-disabled="busy">{{busy?'Creating account...':'Create account →'}}</button></form><p class="error">{{msg}}</p><p class="success">{{success}}</p></section></main><script src="js/app.js"></script></body></html>
