<!doctype html><html ng-app="jobApp"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — JobHub</title><link rel="stylesheet" href="css/style.css"><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script></head><body ng-controller="AuthCtrl"><nav class="nav"><a class="brand" href="index.html">▰ jobhub<span class="dot">.</span></a><a href="register.html">Create account ↗</a></nav><main class="auth-layout"><aside class="auth-aside"><div class="eyebrow">YOUR NEXT CHAPTER</div><h1>Good things<br>start <em>here.</em></h1><p>A more thoughtful way to find work that works for you.</p></aside><section class="auth-card"><div class="eyebrow">WELCOME BACK</div><h2>Log in to JobHub</h2><p class="muted">Pick up where you left off.</p><form ng-submit="login()"><label>Email address</label><input ng-model="data.email" type="email" placeholder="you@example.com" required><label>Password</label><input ng-model="data.password" type="password" required><label>Account type</label><select ng-model="data.role"><option value="seeker">Job seeker</option><option value="recruiter">Recruiter</option><option value="admin">Administrator</option></select><button class="btn primary full" ng-disabled="busy">{{busy?'Signing in...':'Log in securely →'}}</button></form><p class="error">{{msg}}</p><p class="muted">New user? <a class="text-link" href="register.html">Register here</a></p></section></main><script src="js/app.js"></script></body></html>
